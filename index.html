<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robux Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Fredoka', sans-serif;
      background: linear-gradient(145deg, #fff3e0, #ffe0b2);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container, .loader-container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 400px;
      width: 90%;
      transition: all 0.4s ease;
    }

    h1 {
      color: #ff6f00;
      margin-bottom: 20px;
    }

    img {
      width: 120px;
      margin: 15px 0;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    p {
      color: #555;
      font-size: 16px;
      margin-bottom: 25px;
    }

    button {
      background: #ff6f00;
      color: white;
      padding: 14px 28px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 4px 12px rgba(255,111,0,0.4);
    }

    button:hover {
      background: #e65100;
      transform: scale(1.05);
    }

    /* Loader styles */
    .loader-container {
      display: none;
    }

    .loader-text {
      font-size: 18px;
      color: #444;
      margin-bottom: 20px;
    }

    .bar {
      width: 100%;
      height: 20px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #ff6f00, #ffa726);
      animation: loadBar 5s forwards;
    }

    @keyframes loadBar {
      0% { width: 0%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container" id="main">
    <h1>🚀 Free Robux Generator</h1>
    <img src="https://i.imgur.com/iTkESuS.png" alt="Robux">
    <p>Click below to start the generator. Get your free Robux in just 2 steps!</p>
    <button onclick="startLoading()">Start Generator</button>
  </div>

  <div class="loader-container" id="loader">
    <h1>Generating Robux...</h1>
    <p class="loader-text">Connecting to Roblox Server...</p>
    <div class="bar">
      <div class="bar-fill"></div>
    </div>
  </div>

  <script>
    function startLoading() {
      document.getElementById('main').style.display = 'none';
      document.getElementById('loader').style.display = 'block';

      setTimeout(() => {
        window.location.href = "https://hubverify.com/cl/?o=67fe9ed1bd47e";
      }, 5500);
    }
  </script>
</body>
</html>
